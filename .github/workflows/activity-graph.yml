name: Update Activity Graph

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate Activity Graph
        env:
          GH_USERNAME: Techside-Pragyan
          OUTPUT_PATH: assets/activity-graph.svg
        run: node scripts/generate-activity-graph.mjs

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update contribution activity graph [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase --depth=20 origin main && git push; then
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
