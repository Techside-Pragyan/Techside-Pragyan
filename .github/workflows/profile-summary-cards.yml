name: GitHub-Profile-Summary-Cards

on:
  push:
    branches:
      - main
  schedule: # execute every 4 hours
    - cron: "35 */4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-cards

    steps:
      - uses: actions/checkout@v4
      - name: Wait for sibling push workflows
        if: github.event_name == 'push'
        run: |
          sleep 45
          git pull --rebase --depth=20 origin main
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: Techside-Pragyan
          theme: tokyonight
          UTC_OFFSET: 5.5

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if ! git diff --staged --quiet; then
            git commit -m "chore: update profile summary cards"
            for i in 1 2 3; do
              if git pull --rebase --depth=20 origin main && git push; then
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
