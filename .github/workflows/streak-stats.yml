name: Update Streak Stats

on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          options: user=Techside-Pragyan&theme=tokyonight&hide_border=true
          path: assets/streak-stats.svg
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update streak stats [skip ci]"
            for i in 1 2 3; do
              if git pull --rebase --depth=20 origin main && git push; then
                exit 0
              fi
              sleep 2
            done
            exit 1
          fi
