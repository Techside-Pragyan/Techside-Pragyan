<svg xmlns="http://www.w3.org/2000/svg" width="600" height="100" viewBox="0 0 600 100">
  <defs>
    <!-- Tokyo Night Animated Gradient -->
    <linearGradient id="tokyo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7">
        <animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#f7768e;#7aa2f7" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#bb9af7">
        <animate attributeName="stop-color" values="#bb9af7;#f7768e;#7aa2f7;#bb9af7" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f7768e">
        <animate attributeName="stop-color" values="#f7768e;#7aa2f7;#bb9af7;#f7768e" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(0, 15)">
    <!-- Levitation Animation -->
    <animateTransform attributeName="transform" type="translate" values="0,15; 0,5; 0,15" dur="4s" repeatCount="indefinite" />

    <!-- Button Pill -->
    <rect x="50" y="10" width="500" height="50" rx="25" fill="#1a1b27" stroke="url(#tokyo)" stroke-width="4" filter="url(#glow)" />
    
    <!-- Moving Laser Scanner -->
    <rect x="50" y="10" width="500" height="50" rx="25" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.9" stroke-dasharray="80 1500" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="1600;-100" dur="2.5s" repeatCount="indefinite" />
    </rect>

    <!-- Button Text -->
    <text x="300" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" letter-spacing="2">
      ✨ EXPLORE CATEGORIZED TECH STACK ✨
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
    </text>
  </g>
</svg>
