<svg width="800" height="350" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;family=Inter:wght@400;600;700;800&amp;display=swap');
      
      .bg { fill: #1A1B26; rx: 12px; stroke: #3b4261; stroke-width: 1.5px; }
      .header-bg { fill: #16161e; rx: 12px; stroke: #292e42; stroke-width: 1px; }
      
      /* Typography */
      .title { font-family: 'Inter', sans-serif; font-size: 19px; font-weight: 800; fill: #c0caf5; letter-spacing: 1.5px; }
      .text-main { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; fill: #a9b1d6; }
      .text-muted { font-family: 'Inter', sans-serif; font-size: 12px; fill: #565f89; }
      .text-accent { font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 600; fill: #7dcfff; }
      .text-purple { fill: #bb9af7; font-weight: 600; }
      
      /* Stat Boxes */
      .box { fill: #24283b; rx: 10px; stroke: #414868; stroke-width: 1.5px; }
      .box-title { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: #7dcfff; text-transform: uppercase; letter-spacing: 1.5px; }
      .box-value { font-family: 'Fira Code', monospace; font-size: 32px; font-weight: 700; fill: url(#neonGradient); }
      
      /* Animations */
      .status-dot { fill: #9ece6a; filter: drop-shadow(0 0 6px #9ece6a); animation: pulse 2s infinite ease-in-out; }
      @keyframes pulse {
        0%, 100% { r: 5px; opacity: 1; filter: drop-shadow(0 0 8px #9ece6a); }
        50% { r: 6px; opacity: 0.7; filter: drop-shadow(0 0 4px #9ece6a); }
      }
      
      .typing-container {
        animation: typing 4s steps(40, end) infinite;
        overflow: hidden;
      }
      @keyframes typing {
        0%, 20% { width: 0; }
        80%, 100% { width: 350px; }
      }
      
      .cursor {
        fill: #bb9af7;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      .divider { stroke: #292e42; stroke-width: 1.5px; stroke-dasharray: 4 6; }
      .icon { font-size: 16px; }
    </style>

    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dcfff" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <!-- Header Section -->
  <rect x="25" y="25" width="750" height="50" class="header-bg" />
  <text x="45" y="56" class="title">⚡ AI DEVELOPER MISSION CONTROL</text>
  
  <!-- Status Indicator -->
  <circle cx="735" cy="50" r="5" class="status-dot" />
  <text x="590" y="54" class="text-accent" style="font-size: 12px; fill: #9ece6a; font-weight: 700; letter-spacing: 0.5px;">SYSTEM: ONLINE</text>
  
  <!-- Top Stats Row -->
  <g transform="translate(45, 100)">
    <!-- Box 1 -->
    <rect width="220" height="85" class="box" />
    <text x="20" y="32" class="box-title">REPOSITORIES</text>
    <text x="20" y="70" class="box-value">{{REPOS}}</text>
    
    <!-- Box 2 -->
    <rect x="245" y="0" width="220" height="85" class="box" />
    <text x="265" y="32" class="box-title">TOTAL STARS</text>
    <text x="265" y="70" class="box-value">{{STARS}}</text>
    
    <!-- Box 3 -->
    <rect x="490" y="0" width="220" height="85" class="box" />
    <text x="510" y="32" class="box-title">CONTRIBUTIONS</text>
    <text x="510" y="70" class="box-value">{{COMMITS}}</text>
  </g>
  
  <!-- Divider -->
  <line x1="45" y1="210" x2="755" y2="210" class="divider" />
  
  <!-- Bottom Content -->
  <!-- Left Column: Focus -->
  <g transform="translate(45, 240)">
    <text x="0" y="0" class="text-accent">CORE EXPERTISE</text>
    <text x="0" y="26" class="text-main"><tspan class="icon">🧠</tspan> Artificial Intelligence &amp; ML</text>
    <text x="0" y="52" class="text-main"><tspan class="icon">🌐</tspan> High-Performance Full-Stack</text>
    <text x="0" y="78" class="text-main"><tspan class="icon">🛡️</tspan> Next-Gen Cybersecurity</text>
  </g>
  
  <!-- Right Column: Learning -->
  <g transform="translate(400, 240)">
    <text x="0" y="0" class="text-accent">CURRENTLY LEARNING</text>
    
    <!-- Animated Typing Effect -->
    <g transform="translate(0, 10)">
      <text x="0" y="16" class="text-main" style="font-family: 'Fira Code', monospace; fill: #bb9af7; font-weight: 600;">></text>
      <!-- The wrapper SVG handles the width animation for typing -->
      <svg x="15" y="0" width="350" height="30" class="typing-container">
        <text x="0" y="16" class="text-main" style="font-family: 'Fira Code', monospace; fill: #bb9af7; font-weight: 600;">Python → AI/ML → GenAI → Cloud</text>
      </svg>
      <!-- Blinking Cursor -->
      <rect x="300" y="4" width="8" height="15" class="cursor" />
    </g>
    
    <text x="0" y="52" class="text-accent">TECH ARSENAL</text>
    <text x="0" y="76" class="text-main text-purple">React • Node.js • MongoDB • Python • Next.js</text>
  </g>
  
  <!-- Footer -->
  <text x="45" y="335" class="text-muted">Data updated automatically via GitHub Actions • Terminal v2.0</text>
</svg>
